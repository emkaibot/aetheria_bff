# Puertos desplazados (+200) respecto a goveo-bff para poder tener los dos
# levantados a la vez: BFF 8280, Keycloak 8281, Adminer 8282, Postgres 5452,
# correo (Mailpit) en http://localhost:8225.
name: eter

services:
  php:
    build: ./
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      - KEYCLOAK_URL=http://keycloak:8080

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8280:80"
    depends_on:
      - php

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eter
      POSTGRES_PASSWORD: eter_pass
      POSTGRES_DB: eter
      LANG: C.UTF-8
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5452:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "eter", "-U", "eter"]
      interval: 3s
      timeout: 5s
      retries: 20

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    # El SMTP de verdad (SMTP_*) va en .env.local, que no se versiona. Sin él,
    # los correos se quedan en Mailpit. Lo aplica `make keycloak-setup`.
    env_file:
      - path: .env.local
        required: false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HTTP_ENABLED: "true"
      # Fija el `iss` de los tokens: el BFF los pide por la red interna
      # (keycloak:8080) y los comprueba contra esta URL.
      KC_HOSTNAME: http://localhost:8281
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8281:8080"
    depends_on:
      - keycloak-db
      - mailpit
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import

  # Los correos que manda Keycloak (invitaciones para poner la contraseña) se
  # quedan aquí en vez de salir: se leen en http://localhost:8225.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8225:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  adminer:
    image: adminer:latest
    ports:
      - "8282:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db_data:
  keycloak_db_data:
